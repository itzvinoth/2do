<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2do</title>
  <meta name="description" content="A simple, offline-first todo app.">
  <meta name="theme-color" content="#262626">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/oat/oat.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved color theme before first paint.
    try { const c = localStorage.getItem('2do:color'); if (c) document.documentElement.dataset.color = c; } catch {}
  </script>
  <script src="vendor/oat/oat.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Icons. Paths from Lucide (ISC license, lucide.dev). Used as <svg class="i" aria-hidden="true"><use href="#i-name"/></svg>. -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
      <symbol id="i-reopen" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
      <symbol id="i-notes" viewBox="0 0 24 24"><path d="M15 12H3"/><path d="M17 18H3"/><path d="M21 6H3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-list-plus" viewBox="0 0 24 24"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L7.5 3.64A1 1 0 0 0 6 4.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
      <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="i-bold" viewBox="0 0 24 24"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></symbol>
      <symbol id="i-italic" viewBox="0 0 24 24"><path d="M19 4h-9"/><path d="M14 20H5"/><path d="M15 4 9 20"/></symbol>
      <symbol id="i-strikethrough" viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
      <symbol id="i-list-ordered" viewBox="0 0 24 24"><path d="M10 12h11"/><path d="M10 18h11"/><path d="M10 6h11"/><path d="M4 10h2"/><path d="M4 6h1v4"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    </defs>
  </svg>

  <div data-sidebar-layout>
    <header data-topnav>
      <button data-sidebar-toggle class="ghost icon" aria-label="Toggle sidebar"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <a href="#/all" class="brand unstyled"><img src="icons/icon.svg" alt="" width="24" height="24"> 2do</a>
      <span class="spacer"></span>
      <button class="ghost icon" id="btn-import" data-tooltip-placement="bottom" title="Import from .md"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg></button>
      <button class="ghost icon" id="btn-export" data-tooltip-placement="bottom" title="Export to .md"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg></button>
      <ot-dropdown>
        <button class="ghost icon" id="btn-theme" popovertarget="theme-menu" data-tooltip-placement="bottom" title="Color theme"><svg class="i" aria-hidden="true"><use href="#i-palette"/></svg></button>
        <menu popover id="theme-menu" class="theme-menu"></menu>
      </ot-dropdown>
      <input type="file" id="file-import" accept=".md,.markdown,text/markdown,text/plain" hidden>
    </header>

    <aside data-sidebar>
      <nav>
        <ul>
          <li><a href="#/all" data-view="all"><svg class="i" aria-hidden="true"><use href="#i-inbox"/></svg><span class="name">All tasks</span><span class="count" id="count-all"></span></a></li>
          <li><a href="#/archive" data-view="archive"><svg class="i" aria-hidden="true"><use href="#i-archive"/></svg><span class="name">Archive</span><span class="count" id="count-archive"></span></a></li>
        </ul>
        <p class="nav-label">Categories</p>
        <ul id="nav-categories"></ul>
        <form id="form-category" class="add-row small">
          <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
          <input name="name" placeholder="New category" aria-label="New category name" maxlength="80" autocomplete="off" required>
        </form>
      </nav>
    </aside>

    <main id="view"></main>
  </div>

  <!-- Task details. -->
  <dialog id="dlg-task">
    <form method="dialog">
      <header>
        <input name="title" class="dlg-title" maxlength="500" aria-label="Title" required>
      </header>
      <div class="vstack">
        <div class="editor">
          <div class="toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" class="ghost icon small" data-cmd="bold" title="Bold (Ctrl+B)"><svg class="i" aria-hidden="true"><use href="#i-bold"/></svg></button>
            <button type="button" class="ghost icon small" data-cmd="italic" title="Italic (Ctrl+I)"><svg class="i" aria-hidden="true"><use href="#i-italic"/></svg></button>
            <button type="button" class="ghost icon small" data-cmd="strikeThrough" title="Strikethrough"><svg class="i" aria-hidden="true"><use href="#i-strikethrough"/></svg></button>
            <button type="button" class="ghost icon small" data-cmd="code" title="Code"><svg class="i" aria-hidden="true"><use href="#i-code"/></svg></button>
            <span class="sep"></span>
            <button type="button" class="ghost icon small" data-cmd="insertUnorderedList" title="Bulleted list"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg></button>
            <button type="button" class="ghost icon small" data-cmd="insertOrderedList" title="Numbered list"><svg class="i" aria-hidden="true"><use href="#i-list-ordered"/></svg></button>
            <button type="button" class="ghost icon small" data-cmd="link" title="Link (Ctrl+K)"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg></button>
          </div>
          <div id="notes" class="editor-body" contenteditable="true" role="textbox" aria-multiline="true"
            aria-label="Notes" data-placeholder="Add details&hellip;"></div>
        </div>
        <div class="row">
          <label class="col-4">Priority
            <select name="priority">
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label class="col-4">Due date <input type="date" name="due"></label>
          <label class="col-4">Category <select name="categoryId"></select></label>
        </div>
      </div>
      <footer>
        <button type="button" class="ghost" commandfor="dlg-task" command="close">Cancel</button>
        <button value="save">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- Generic confirm / prompt. -->
  <dialog id="dlg-ask">
    <form method="dialog">
      <header>
        <h3 data-title></h3>
        <p data-message></p>
      </header>
      <div data-input-wrap>
        <input name="value" maxlength="80" aria-label="Value">
      </div>
      <footer data-buttons></footer>
    </form>
  </dialog>
</body>
</html>
